<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Community red tide (PSP) advisory map and report tracker for the coastal waters of Puerto Princesa, Palawan."
    />

    <!--
      Display / body / data typefaces.

      Loaded from Google Fonts rather than self-hosted: the map tiles come from
      OpenStreetMap at runtime, so the app already requires a network connection
      — an extra font request adds no new failure mode. The `display=swap` and
      the fallback stacks in index.css mean the layout stays intact if the fonts
      never arrive.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <title>Red Tide PPC — Puerto Princesa PSP Advisory Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
