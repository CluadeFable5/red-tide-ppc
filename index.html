<!doctype html>
<!--
  The ink ground is set here as well as in index.css (where it is the `body`
  colour) so there is no window — on a cold load before the stylesheet arrives —
  in which the browser can paint its default white. The route dissolve depends on
  this: the moment between two pages is supposed to be dark, and this is the one
  background that exists before any CSS does.
-->
<html lang="en" style="background-color: #0a0a0a">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Community red tide (PSP) advisory map and report tracker for the coastal waters of Puerto Princesa, Palawan."
    />

    <!-- Fonts are self-hosted via the Latin-only @fontsource imports in
         src/main.tsx. Vite fingerprints the assets; font-display: swap keeps
         text readable while they load, with no Google Fonts connection. -->
    <title>Red Tide PPC — Puerto Princesa PSP Advisory Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
