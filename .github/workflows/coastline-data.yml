name: Coastline data (temporary)

# TEMPORARY workflow (Arena session, 2026-09-18).
#
# The coding sandbox cannot reach the Overpass API, so this one-shot job pulls
# the real OSM coastline for the Puerto Princesa area on a GitHub runner and
# commits a compact snapshot to `.cache/` (git-ignored in normal use) so the
# advisory-zone polygons in `src/data/zones.ts` can be re-plotted against the
# actual shoreline. Delete with `scripts/fetch-coastline.mjs` when done.

on:
  push:
    paths:
      - '.github/workflows/coastline-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch OSM coastline
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # No npm install needed: the script uses the Node 22 global fetch.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fetch coastline
        run: node scripts/fetch-coastline.mjs

      - name: Commit the snapshot so the sandbox can read it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .cache/coastline
          git commit -m "chore(temp): OSM coastline snapshot for zone re-plotting [skip ci]"
          git push
