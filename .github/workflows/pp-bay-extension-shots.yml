# Before/after screenshots for the pp-bay northern extension on REAL tiles.
#
# The dev sandbox cannot reach any tile host (egress is blocked), so these
# captures run here, on a GitHub runner: build the branch (after) and the
# pre-task base (before) side by side, screenshot each with
# scripts/pp-bay-extension-shots.mjs, and commit the PNGs back to the branch
# that triggered the run.
#
# Only runs when the capture script itself changes, so it stays dormant
# otherwise. Safe to keep: it never touches src/.

name: pp-bay extension shots

on:
  push:
    paths:
      - 'scripts/pp-bay-extension-shots.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    name: Capture before/after on real tiles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out (full history for the before-worktree)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (after)
        run: npm ci

      - name: Build after
        run: npm run build

      - name: Build before worktree at the pre-task base
        run: |
          git worktree add /tmp/pp-bay-before bd7017ed1afa541dd414724e26e4d4e668a0e711
          cd /tmp/pp-bay-before
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci --no-audit --no-fund
          npm run build

      - name: Serve both builds
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &>/tmp/preview-after.log &
          cd /tmp/pp-bay-before && npx vite preview --port 4174 --strictPort --host 127.0.0.1 &>/tmp/preview-before.log &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && curl -sf http://127.0.0.1:4174/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null && curl -sf http://127.0.0.1:4174/ >/dev/null

      - name: Capture after
        run: BASE_URL=http://127.0.0.1:4173 PREFIX=after REQUIRE_TILES=1 node scripts/pp-bay-extension-shots.mjs

      - name: Capture before
        run: BASE_URL=http://127.0.0.1:4174 PREFIX=before REQUIRE_TILES=1 node scripts/pp-bay-extension-shots.mjs

      - name: Commit screenshots
        run: |
          git config user.name "pp-bay-shots-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pp-bay-extension-shots
          git commit -m "pp-bay: before/after extension shots on real tiles [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
