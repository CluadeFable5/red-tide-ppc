# Inlet trace-identification screenshots on REAL tiles.
#
# The dev sandbox cannot reach any tile host (egress is blocked), so these
# captures run here, on a GitHub runner: build the branch, screenshot the
# bay-mouth / apex / gap framings with scripts/inlet-shots.mjs, and commit
# the PNGs back to the branch that triggered the run.
#
# Only runs when the capture script itself changes, so it stays dormant
# otherwise. Safe to keep: it never touches src/.

name: inlet shots

on:
  push:
    paths:
      - 'scripts/inlet-shots.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    name: Capture inlet framings on real tiles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 4175 --strictPort --host 127.0.0.1 &>/tmp/preview-inlet.log &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4175/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4175/ >/dev/null

      - name: Capture
        run: BASE_URL=http://127.0.0.1:4175 PREFIX=trace-id REQUIRE_TILES=1 node scripts/inlet-shots.mjs

      - name: Commit screenshots
        run: |
          git config user.name "inlet-shots-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/inlet-shots
          git commit -m "inlet: trace-identification shots on real tiles [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
